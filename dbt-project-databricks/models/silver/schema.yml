version: 2

models:
  - name: int_bird_detections_cleaned
    description: "Cleaned bird detections with normalized scientific names. Timestamps are naive UTC."
    columns:
      - name: detection_id
        description: "Primary key, renamed from raw_id."
        tests:
          - not_null
          - unique
      - name: detected_at_utc
        tests:
          - not_null
      - name: scientific_name
        tests:
          - not_null

  - name: int_telemetry_cleaned
    description: "Cleaned enclosure sensor readings. Timestamps stay naive UTC (no Chicago conversion in silver)."
    columns:
      - name: recorded_at_utc
        tests:
          - not_null
