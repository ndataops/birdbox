name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [master]

jobs:
  dbt-parse:
    name: dbt parse (Databricks project)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt-project-databricks
    env:
      # Placeholders: dbt parse validates the project without connecting to a warehouse
      DBT_PROFILES_DIR: .
      DATABRICKS_HOST: ci-placeholder.cloud.databricks.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci-placeholder
      DATABRICKS_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt (pinned to production versions)
        run: pip install "dbt-core==1.12.5" "dbt-databricks==1.12.6"

      - name: dbt parse
        run: dbt parse

  lint:
    name: ruff (Dagster pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Run ruff
        run: ruff check birdbox_pipeline/