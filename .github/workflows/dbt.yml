name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [master]

jobs:
  dbt-parse:
    name: dbt parse (Databricks project)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt-project-databricks
    env:
      # Placeholders: dbt parse validates the project without connecting to a warehouse
      DBT_PROFILES_DIR: .
      DATABRICKS_HOST: ci-placeholder.cloud.databricks.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci-placeholder
      DATABRICKS_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt (pinned to production versions)
        run: pip install "dbt-core==1.12.5" "dbt-databricks==1.12.6"

      - name: dbt parse
        run: dbt parse

  lint:
    name: ruff (Dagster pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Run ruff
        run: ruff check birdbox_pipeline/

  dbt-build:
    name: dbt build + tests (Databricks, isolated schemas)
    runs-on: ubuntu-latest
    needs: dbt-parse
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    concurrency:
      group: dbt-build-${{ github.event.number }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: dbt-project-databricks
    env:
      DBT_PROFILES_DIR: .
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_CI_PREFIX: ci_pr_${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt (pinned to production versions)
        run: pip install "dbt-core==1.12.5" "dbt-databricks==1.12.6"

      - name: Wait for SQL warehouse
        run: |
          for i in 1 2 3 4 5 6; do
            if dbt debug --target ci; then exit 0; fi
            echo "Warehouse not ready (attempt $i), waiting 30s"
            sleep 30
          done
          exit 1

      - name: dbt build (models + tests)
        run: dbt build --target ci --exclude assert_telemetry_is_fresh

      - name: Idempotency check (incremental re-run must not change the table)
        run: |
          before=$(dbt run-operation fingerprint --args '{model_name: fct_detections_with_weather}' --target ci | grep -o 'FINGERPRINT=.*')
          dbt run --select fct_detections_with_weather --target ci
          after=$(dbt run-operation fingerprint --args '{model_name: fct_detections_with_weather}' --target ci | grep -o 'FINGERPRINT=.*')
          echo "before: $before"
          echo "after:  $after"
          [ -n "$before" ] && [ "$before" = "$after" ]

      - name: Drop CI schemas
        if: always()
        run: dbt run-operation drop_ci_schemas --target ci