name: dbt build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [master]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt-project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb==1.9.0

      - name: Create data directory
        run: mkdir -p ../data

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          birdbox:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ../data/lakehouse.duckdb
                threads: 4
                extensions:
                  - httpfs
                  - sqlite
          PROFILE

      - name: dbt debug
        run: dbt debug

      - name: dbt seed
        run: dbt seed

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Run ruff
        run: ruff check birdbox_pipeline/
